name: NavvyaSignal Daily Briefing

on:
  schedule:
    # GST = UTC+4. Cron time below is in UTC.
    - cron: "0 14 * * *"   # 18:00 GST — full briefing, all desks, sends email + WhatsApp
  workflow_dispatch:
    inputs:
      run_type:
        description: "Run type: general (all desks) or uae_refresh (UAE-focused)"
        required: false
        default: "general"
        type: choice
        options: ["general", "uae_refresh"]
      send_output:
        description: "Send email/WhatsApp this run?"
        required: false
        default: true
        type: boolean

jobs:
  run-briefing:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Determine run type and send flag
        id: runtype
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run_type=${{ github.event.inputs.run_type }}" >> "$GITHUB_OUTPUT"
            echo "send_output=${{ github.event.inputs.send_output }}" >> "$GITHUB_OUTPUT"
          else
            echo "run_type=general" >> "$GITHUB_OUTPUT"
            echo "send_output=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run briefing script
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          KIT_API_KEY: ${{ secrets.KIT_API_KEY }}
          KIT_FROM_EMAIL: ${{ secrets.KIT_FROM_EMAIL }}
          WHAPI_TOKEN: ${{ secrets.WHAPI_TOKEN }}
          WHAPI_CHANNEL_ID: ${{ secrets.WHAPI_CHANNEL_ID }}
          OPS_NOTIFY_NUMBER: ${{ secrets.OPS_NOTIFY_NUMBER }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          RUN_TYPE: ${{ steps.runtype.outputs.run_type }}
          SEND_OUTPUT: ${{ steps.runtype.outputs.send_output }}
        run: python main.py
