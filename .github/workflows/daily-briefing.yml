name: NavvyaSignal Daily Briefing

on:
  schedule:
    # GST = UTC+4. Cron times below are in UTC. Each offset a few minutes past the hour —
    # GitHub Actions documents that scheduled runs at the exact top of the hour are more
    # likely to be delayed or silently skipped under high load.
    #
    # 7-desk structure: every desk gets its own solo run (no more multi-desk groups). West
    # Asia, Maritime/Energy/Supply Chains, and Technology & AI are spread across different
    # times from each other, not just given solo status, since all three intersect with the
    # ongoing conflict narrative and were the desks most prone to under-coverage before.
    #
    # IMPORTANT: this list must stay in sync with CRON_TO_RUN_TYPE in main.py — that dict is
    # the single source of truth for which cron maps to which run_type. This workflow no longer
    # resolves that mapping itself; it just passes the raw matched cron string through as
    # CRON_SCHEDULE and lets main.py look it up. Adding/changing a schedule means updating BOTH
    # this list and CRON_TO_RUN_TYPE together — main.py will fail loudly (not silently) if they
    # ever drift out of sync.
    - cron: "33 1 * * *"    # 05:33 GST — West Asia
    - cron: "33 2 * * *"    # 06:33 GST — Maritime Energy & Supply Chains
    - cron: "33 10 * * *"   # 14:33 GST — Technology & AI
    - cron: "3 11 * * *"    # 15:03 GST — UAE
    - cron: "33 11 * * *"   # 15:33 GST — India
    - cron: "3 12 * * *"    # 16:03 GST — Global Politics
    - cron: "33 12 * * *"   # 16:33 GST — Markets & Capital
    - cron: "3 14 * * *"    # 18:03 GST — Compile & Send: assembles today's entries, sends email + WhatsApp
    - cron: "4 12 * * 5"    # 16:04 GST, Fridays only — Weekly synthesis (Gulf Briefing)
  workflow_dispatch:
    inputs:
      run_type:
        description: "Run type: one of the 7 desk keys (research only, no send), compile_send (sends), weekly_synthesis, watchlist_test, or whapi_test"
        required: false
        default: "compile_send"
        type: choice
        options:
          - "west_asia"
          - "maritime_energy"
          - "technology_ai"
          - "uae"
          - "india"
          - "global_politics"
          - "markets_capital"
          - "compile_send"
          - "weekly_synthesis"
          - "watchlist_test"
          - "whapi_test"
      send_output:
        description: "Send email/WhatsApp this run? (ignored for desk runs and weekly_synthesis — they never send)"
        required: false
        default: true
        type: boolean
      dry_run:
        description: "Dry run — log intended Notion writes instead of performing them (for testing new logic paths safely)"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  run-briefing:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # For schedule events, just pass the raw matched cron string through — main.py's
      # CRON_TO_RUN_TYPE dict is the single source of truth for resolving it to a run_type.
      # For workflow_dispatch, pass the explicit inputs straight through as before.
      - name: Determine trigger inputs
        id: runtype
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run_type=${{ github.event.inputs.run_type }}" >> "$GITHUB_OUTPUT"
            echo "send_output=${{ github.event.inputs.send_output }}" >> "$GITHUB_OUTPUT"
            echo "dry_run=${{ github.event.inputs.dry_run }}" >> "$GITHUB_OUTPUT"
            echo "cron_schedule=" >> "$GITHUB_OUTPUT"
          else
            echo "run_type=" >> "$GITHUB_OUTPUT"
            echo "send_output=false" >> "$GITHUB_OUTPUT"
            echo "dry_run=false" >> "$GITHUB_OUTPUT"
            echo "cron_schedule=${{ github.event.schedule }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Run briefing script
        id: runbriefing
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          KIT_API_KEY: ${{ secrets.KIT_API_KEY }}
          KIT_FROM_EMAIL: ${{ secrets.KIT_FROM_EMAIL }}
          WHAPI_TOKEN: ${{ secrets.WHAPI_TOKEN }}
          WHAPI_CHANNEL_ID: ${{ secrets.WHAPI_CHANNEL_ID }}
          OPS_NOTIFY_NUMBER: ${{ secrets.OPS_NOTIFY_NUMBER }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          RUN_TYPE: ${{ steps.runtype.outputs.run_type }}
          SEND_OUTPUT: ${{ steps.runtype.outputs.send_output }}
          DRY_RUN: ${{ steps.runtype.outputs.dry_run }}
          CRON_SCHEDULE: ${{ steps.runtype.outputs.cron_schedule }}
        run: |
          mkdir -p logs
          python main.py 2>&1 | tee logs/latest.txt
          exit ${PIPESTATUS[0]}
        shell: bash

      # Always commit the log, even if the run above failed — this is what lets Claude (or
      # anyone else) read the actual output via the GitHub Contents API instead of the Actions
      # log-blob storage domain, which is blocked in some sandboxed environments.
      - name: Commit run log
        if: always()
        run: |
          git config user.name "navvyasignal-bot"
          git config user.email "actions@github.com"
          git add logs/latest.txt
          git commit -m "Log: run at $(date -u +%Y-%m-%dT%H:%M:%SZ) (cron=${{ steps.runtype.outputs.cron_schedule }}, dispatch=${{ steps.runtype.outputs.run_type }})" || echo "Nothing to commit"
          git push || echo "Push failed (non-fatal, log commit is best-effort)"
