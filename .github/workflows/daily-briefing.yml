name: NavvyaSignal Daily Briefing

on:
  schedule:
    # GST = UTC+4. Cron times below are in UTC. Each offset a few minutes past the hour —
    # GitHub Actions documents that scheduled runs at the exact top of the hour are more
    # likely to be delayed or silently skipped under high load.
    - cron: "30 1 * * *"    # 05:30 GST — Maritime & Energy (solo — dominates shared attention otherwise)
    - cron: "30 2 * * *"    # 06:30 GST — West Asia (solo — same reason)
    - cron: "30 11 * * *"   # 15:30 GST — UAE + Trends & Forecasting
    - cron: "30 12 * * *"   # 16:30 GST — India + Real Estate & Infrastructure
    - cron: "30 13 * * *"   # 17:30 GST — Markets & Capital + Global Politics + Sports
    - cron: "30 14 * * *"   # 18:30 GST — Compile & Send: assembles today's entries, sends email + WhatsApp
  workflow_dispatch:
    inputs:
      run_type:
        description: "Run type: a desk-group key (research only, no send) or compile_send (sends)"
        required: false
        default: "compile_send"
        type: choice
        options:
          - "maritime_energy"
          - "west_asia"
          - "uae_trends"
          - "india_realestate"
          - "markets_politics_sports"
          - "compile_send"
          - "whapi_test"
      send_output:
        description: "Send email/WhatsApp this run? (ignored for desk-group runs — they never send)"
        required: false
        default: true
        type: boolean

jobs:
  run-briefing:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Determine run type and send flag
        id: runtype
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run_type=${{ github.event.inputs.run_type }}" >> "$GITHUB_OUTPUT"
            echo "send_output=${{ github.event.inputs.send_output }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "30 1 * * *" ]; then
            echo "run_type=maritime_energy" >> "$GITHUB_OUTPUT"
            echo "send_output=false" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "30 2 * * *" ]; then
            echo "run_type=west_asia" >> "$GITHUB_OUTPUT"
            echo "send_output=false" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "30 11 * * *" ]; then
            echo "run_type=uae_trends" >> "$GITHUB_OUTPUT"
            echo "send_output=false" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "30 12 * * *" ]; then
            echo "run_type=india_realestate" >> "$GITHUB_OUTPUT"
            echo "send_output=false" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "30 13 * * *" ]; then
            echo "run_type=markets_politics_sports" >> "$GITHUB_OUTPUT"
            echo "send_output=false" >> "$GITHUB_OUTPUT"
          else
            echo "run_type=compile_send" >> "$GITHUB_OUTPUT"
            echo "send_output=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run briefing script
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          KIT_API_KEY: ${{ secrets.KIT_API_KEY }}
          KIT_FROM_EMAIL: ${{ secrets.KIT_FROM_EMAIL }}
          WHAPI_TOKEN: ${{ secrets.WHAPI_TOKEN }}
          WHAPI_CHANNEL_ID: ${{ secrets.WHAPI_CHANNEL_ID }}
          OPS_NOTIFY_NUMBER: ${{ secrets.OPS_NOTIFY_NUMBER }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          RUN_TYPE: ${{ steps.runtype.outputs.run_type }}
          SEND_OUTPUT: ${{ steps.runtype.outputs.send_output }}
        run: python main.py
